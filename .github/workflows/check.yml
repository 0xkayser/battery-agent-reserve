name: SDK and website checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Ledger and adapter failure boundaries (offline fixtures)
        run: python3 -m unittest -v test_battery.py test_live_agent.py test_integrated_runtime.py
      - name: Verify published actual-run record
        run: python3 verify_evidence.py
      - name: Verify mainnet researcher artifact (offline)
        run: python3 verify_evidence.py evidence/mainnet-agent.json
      - name: Bounded mainnet policies and transaction recovery (no broadcast)
        working-directory: chain
        run: |
          npm ci --ignore-scripts --omit=dev
          npm test
          node verify-canary.mjs
          node verify-integrated.mjs
      - name: Offline logical replay
        run: python3 paper_replay.py
      - name: Devnet memo policy and serialization (no signing broadcast)
        run: node --test devnet/anchor.test.mjs
      - name: Website API boundaries and simulation regressions
        working-directory: site
        run: |
          node --test test-network.mjs
          node checks.mjs
          node store-checks.mjs
      - name: Regenerate pages and source kit
        working-directory: site
        run: |
          python3 build-pages.py
          python3 build-kit.py
